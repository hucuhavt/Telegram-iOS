name: AyuGram iOS build

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Name under the icon on the home screen"
        type: choice
        options:
          - AyuGram
          - Telegram
        default: AyuGram
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "::error::Secrets API_ID and API_HASH are not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version
          df -h /

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ github.sha }}
          restore-keys: bazel-

      - name: Write build configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'EOF'
          import json, os
          config = json.load(open("build-system/appstore-configuration.json"))
          config["api_id"] = os.environ["API_ID"].strip()
          config["api_hash"] = os.environ["API_HASH"].strip()
          config["is_appstore_build"] = "false"
          config["enable_siri"] = False
          config["enable_icloud"] = False
          json.dump(config, open(os.path.expanduser("~/ayugram-configuration.json"), "w"), indent=2)
          EOF

      - name: Set app name
        env:
          APP_NAME: ${{ inputs.app_name || 'AyuGram' }}
        run: |
          python3 - <<'EOF'
          import os, re
          name = os.environ["APP_NAME"]
          s = open("Telegram/BUILD", encoding="utf-8").read()
          head, sep, tail = s.partition('name = "TelegramInfoPlist"')
          assert sep, "TelegramInfoPlist not found"
          tail = re.sub(r"(<key>CFBundleDisplayName</key>\s*<string>)[^<]*(</string>)", lambda m: m.group(1) + name + m.group(2), tail, count=1)
          open("Telegram/BUILD", "w", encoding="utf-8").write(head + sep + tail)
          EOF
          grep -n -A1 CFBundleDisplayName Telegram/BUILD

      - name: Build
        run: |
          set -x
          BUILD_NUMBER=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir ~/telegram-bazel-cache \
            build \
            --configurationPath ~/ayugram-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p build/artifacts
          cp bazel-bin/Telegram/Telegram.ipa build/artifacts/AyuGram.ipa
          ls -la build/artifacts

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ github.sha }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-$BUILD_NUMBER" build/artifacts/AyuGram.ipa \
            --title "AyuGram iOS $APP_VERSION ($BUILD_NUMBER)" \
            --notes "Unsigned build from ${GITHUB_SHA::7}. Install with Sideloadly."

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            bazel-out/_tmp/actions/*.log
          if-no-files-found: ignore
